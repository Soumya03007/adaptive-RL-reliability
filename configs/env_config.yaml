default_task: "balanced"

dynamics:
  latency_scale_up: [0.5, 0.8]
  latency_scale_down: [1.2, 1.6]

  cpu_scale_up: [1.1, 1.4]
  cpu_scale_down: [0.7, 1.0]

  noise:
    latency: [0.9, 1.2]
    cpu: [0.9, 1.1]

  failure:
    prob: 0.1
    impact: [1.5, 2.5]

reward:
  latency_weight: 3.0
  error_weight: 5.0
  cpu_weight: 1.0
  scale_action_weight: 0.03
  action_change_weight: 0.08

traffic:
  base: [0.3, 0.7]
  volatility: [0.9, 1.2]

tasks:
  balanced: {}

  high_traffic:
    traffic:
      base: [0.6, 0.95]
      volatility: [1.0, 1.3]

  failure_heavy:
    dynamics:
      noise:
        latency: [0.95, 1.25]
        cpu: [0.95, 1.15]
      failure:
        prob: 0.2
        impact: [1.8, 2.8]

  cost_sensitive:
    reward:
      cpu_weight: 2.0
      scale_action_weight: 0.08
      action_change_weight: 0.12
