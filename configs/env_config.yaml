default_task: "balanced"

dynamics:
  latency_scale_up: [0.6, 0.82]
  latency_scale_down: [1.08, 1.28]

  cpu_scale_up: [0.58, 0.85]
  cpu_scale_down: [1.1, 1.35]

  noise:
    latency: [0.94, 1.08]
    cpu: [0.94, 1.08]

  failure:
    prob: 0.04
    impact: [1.25, 1.8]

  recovery:
    latency_decay: [0.9, 0.97]
    cpu_decay: [0.9, 0.97]
    error_decay: [0.03, 0.08]
    scale_up_error_multiplier: [0.65, 0.9]
    scale_down_error_multiplier: [1.0, 1.08]

reward:
  latency_weight: 3.0
  error_weight: 5.0
  cpu_weight: 1.0
  scale_action_weight: 0.03
  action_change_weight: 0.08

traffic:
  base: [0.25, 0.55]
  volatility: [0.92, 1.1]
  reversion: 0.18

tasks:
  balanced: {}

  high_traffic:
    dynamics:
      recovery:
        cpu_decay: [0.85, 0.93]
    traffic:
      base: [0.5, 0.8]
      volatility: [0.96, 1.16]

  failure_heavy:
    dynamics:
      noise:
        latency: [0.96, 1.12]
        cpu: [0.96, 1.1]
      failure:
        prob: 0.12
        impact: [1.45, 2.1]
      recovery:
        error_decay: [0.02, 0.05]
    traffic:
      base: [0.35, 0.65]
      volatility: [0.95, 1.14]

  cost_sensitive:
    reward:
      cpu_weight: 2.0
      scale_action_weight: 0.08
      action_change_weight: 0.12
