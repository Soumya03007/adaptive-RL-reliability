[project]
name = "adaptive-rl-reliability"
version = "0.1.0"
description = "OpenEnv-compatible reliability control simulator for live-system autoscaling."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "numpy>=2.0.0",
    "openai>=2.30.0",
    "openenv-core>=0.2.3",
    "pydantic>=2.12.0",
    "torch>=2.11.0",
    "tensordict>=0.11.0",
    "torchrl>=0.11.1",
    "uvicorn>=0.40.0",
]

[project.scripts]
server = "server.app:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["envs", "models", "scripts", "training", "utils", "tests"]
extraPaths = ["."]
